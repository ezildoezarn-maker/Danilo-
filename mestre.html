<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Mestre — Megas Express</title>
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.json">
<script src="/acesso.js"></script>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --tx:#e8ecf1; --mut:#8b96a5; --linha:#262d3a; --pri:#3ddc84; --pri-tx:#0d1117;
  --ok:#3ddc84; --mau:#ff7b6b; --aviso:#f5a623; --chip:#1c2230; --sombra:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",Roboto,-apple-system,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0 0 10px}
.topo{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--linha)}
.topo .esp{flex:1}
.mut{color:var(--mut)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--chip);cursor:pointer;font-weight:600}
.btn.pri{background:var(--pri);color:var(--pri-tx)}
.btn.mau{background:transparent;color:var(--mau);border:1px solid var(--mau)}
.btn.peq{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.card{background:var(--card);border-radius:14px;box-shadow:var(--sombra);border:1px solid var(--linha);padding:14px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:12px;box-shadow:var(--sombra)}
.tile b{display:block;font-size:24px;line-height:1.1}
.tile span{font-size:12px;color:var(--mut)}
.app{display:flex;gap:12px;align-items:center;cursor:pointer}
.app .info{flex:1;min-width:0}
.app .nome{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .sub{font-size:13px;color:var(--mut)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--mut)}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.off{background:var(--mau);box-shadow:0 0 0 4px color-mix(in srgb,var(--mau) 22%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.ok{color:var(--ok)} .chip.mau{color:var(--mau)} .chip.av{color:var(--aviso)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--linha);background:var(--card)}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:0}
.linha{display:flex;gap:8px}
.linha>*{flex:1}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.folha{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.fundo{align-items:center}.folha{border-radius:18px}}
.erro{color:var(--mau);font-size:14px;margin-top:8px;min-height:1em}
.acao{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.conta{padding:12px 0;border-top:1px solid var(--linha)}
.conta:first-child{border-top:0}
.conta .t{display:flex;gap:8px;align-items:center;justify-content:space-between}
.vazio{text-align:center;color:var(--mut);padding:28px 8px}
.login{max-width:360px;margin:12vh auto 0;text-align:center}
.login img{width:72px;height:72px;border-radius:18px}
.pinput{text-align:center;font-size:24px;letter-spacing:6px}
.res{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--linha);font-size:14px}
.pick{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--linha)}
.pick input{width:20px;height:20px;flex:none;accent-color:var(--pri)}
.pick:first-of-type{border-top:0}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:40;font-weight:600;max-width:90vw}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 6px 18px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
"use strict";
const $raiz = document.getElementById("raiz");
const PERFIS = { fornecedor: "Fornecedor", revendedor: "Revendedor" };
let apps = [], resumo = null, vista = { tipo: "home" }, timer = null;

function lerLS(k){ try { return localStorage.getItem("mestre_"+k) || ""; } catch(_) { return ""; } }
function gravarLS(k,v){ try { v ? localStorage.setItem("mestre_"+k,v) : localStorage.removeItem("mestre_"+k); } catch(_) {} }
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const dataCurta = (iso) => iso ? new Date(iso).toLocaleDateString("pt-MZ",{day:"2-digit",month:"2-digit",year:"numeric"}) : "";
function h(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }

// Todos os pedidos vão por /api/contas-acao (rota de dono que o app já permite); o acesso.js junta a sessão.
async function api(metodo, rota, corpo){
  const r = await fetch("/api/contas-acao", { method: "POST", headers: { "content-type":"application/json" }, body: JSON.stringify({ mestre: true, metodo, rota, corpo: corpo || {} }) });
  let j = {}; try { j = await r.json(); } catch(_) {}
  if (!r.ok) { const e = new Error(j.msg || "Erro"); e.dados = j; throw e; }
  return j;
}
function toast(t){ const e=h(`<div class="toast">${esc(t)}</div>`); document.body.appendChild(e); setTimeout(()=>e.remove(),2600); }

// ---------- folhas (janelas) ----------
function folha(conteudo){
  const f = h(`<div class="fundo"><div class="folha"></div></div>`);
  f.querySelector(".folha").appendChild(conteudo);
  f.addEventListener("click", e => { if (e.target === f) f.remove(); });
  document.body.appendChild(f);
  return f;
}

// ---------- home ----------
function resumoChips(a){
  const e = a.estado, r = e && e.resumo;
  if (!r) return `<span class="chip">sem dados</span>`;
  const L = r.licenca;
  const c = [L && L.limitada
    ? (L.suspenso ? `<span class="chip mau">🔒 BOT SUSPENSO</span>` : `<span class="chip ${L.dias<=3?"av":"ok"}">Bot: ${L.dias} dia${L.dias===1?"":"s"}</span>`)
    : `<span class="chip">Bot: sem limite</span>`];
  c.push(`<span class="chip">${r.contas} conta${r.contas===1?"":"s"}</span>`);
  if (r.ativos.fornecedor) c.push(`<span class="chip ok">${r.ativos.fornecedor} fornecedor</span>`);
  if (r.ativos.revendedor) c.push(`<span class="chip ok">${r.ativos.revendedor} revendedor</span>`);
  if (r.aExpirar.length) c.push(`<span class="chip av">${r.aExpirar.length} a expirar</span>`);
  if (r.expiradas.length) c.push(`<span class="chip mau">${r.expiradas.length} expirada${r.expiradas.length===1?"":"s"}</span>`);
  return c.join("");
}
function ecraHome(){
  const t = resumo || {};
  const el = h(`<div>
    <div class="topo"><span style="font-size:22px">🛰️</span><h1>Painel Mestre</h1><span class="esp"></span>
      <button class="btn peq" id="massa">⚡ Em massa</button><a class="btn peq" href="/index.html" style="text-decoration:none;color:inherit">← Painel</a></div>
    <div class="wrap">
      <div class="tiles">
        <div class="tile"><b>${t.online ?? 0}/${t.apps ?? 0}</b><span>apps online</span></div>
        <div class="tile"><b>${(t.fornecedores||0)+(t.revendedores||0)}</b><span>alugueres ativos</span></div>
        <div class="tile"><b style="color:${(t.aExpirar||0)+(t.expiradas||0)+(t.suspensos||0)+(t.botsAExpirar||0)?"var(--aviso)":"inherit"}">${(t.aExpirar||0)+(t.expiradas||0)+(t.suspensos||0)+(t.botsAExpirar||0)}</b><span>a pagar / expirados</span></div>
      </div>
      <div id="lista"></div>
    </div>
    <button class="btn pri fab" id="novo">＋ Adicionar app</button></div>`);
  const lista = el.querySelector("#lista");
  if (!apps.length) lista.innerHTML = `<div class="vazio">Ainda não tem nenhum app.<br>Toque em <b>＋ Adicionar app</b> para ligar o primeiro bot.</div>`;
  apps.forEach(a => {
    const on = a.estado ? a.estado.online : null;
    const c = h(`<div class="card app"><span class="dot ${on===true?"on":on===false?"off":""}"></span>
      <div class="info"><div class="nome">${esc(a.nome)}</div>
      <div class="sub">${on===false ? "⚠️ "+esc(a.estado.erro||"Offline") : esc(a.url)}</div>
      <div class="chips">${resumoChips(a)}</div></div><span class="mut">›</span></div>`);
    c.onclick = () => { vista = { tipo:"app", id:a.id }; desenhar(); };
    lista.appendChild(c);
  });
  el.querySelector("#novo").onclick = abrirNovoApp;
  el.querySelector("#massa").onclick = abrirMassa;
  return el;
}

function abrirNovoApp(){
  const el = h(`<div><h2>Adicionar app</h2>
    <label>Nome (quem aluga)</label><input id="n" placeholder="Ex.: Carlos">
    <label>Endereço do bot</label><input id="u" placeholder="http://1.2.3.4:2006" inputmode="url" autocapitalize="off">
    <label>Chave do bot</label><input id="c" placeholder="cole a chave que o bot mostra no log" autocapitalize="off">
    <div class="erro" id="er"></div>
    <div class="acao"><button class="btn pri" id="ok">Ligar</button><button class="btn" id="x">Cancelar</button></div></div>`);
  const f = folha(el);
  el.querySelector("#x").onclick = () => f.remove();
  const enviar = async (forcar) => {
    const er = el.querySelector("#er"); er.textContent = "";
    try {
      await api("POST","/apps",{ nome: el.querySelector("#n").value, url: el.querySelector("#u").value, chave: el.querySelector("#c").value, forcar });
      f.remove(); toast("App adicionado"); await recarregar();
    } catch(e){
      er.textContent = e.message;
      if (e.dados && e.dados.podeForcar && !el.querySelector("#forcar")) {
        const b = h(`<button class="btn" id="forcar">Adicionar mesmo assim</button>`);
        b.onclick = () => enviar(true); el.querySelector(".acao").appendChild(b);
      }
    }
  };
  el.querySelector("#ok").onclick = () => enviar(false);
}

// ---------- detalhe do app ----------
async function ecraApp(id){
  const a = apps.find(x => x.id === id);
  if (!a) { vista = { tipo:"home" }; return ecraHome(); }
  const on = a.estado ? a.estado.online : null;
  const el = h(`<div>
    <div class="topo"><button class="btn peq" id="volta">‹</button><h1 style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.nome)}</h1>
      <button class="btn peq" id="edit">Editar</button></div>
    <div class="wrap">
      <div class="card"><div class="app" style="cursor:default"><span class="dot ${on===true?"on":on===false?"off":""}"></span>
        <div class="info"><div class="nome">${on===true?"Online":on===false?"Offline":"A verificar…"}${on===true&&a.estado.ms?` · ${a.estado.ms} ms`:""}</div>
        <div class="sub">${on===false?esc(a.estado.erro||""):esc(a.url)}</div></div>
        <button class="btn peq" id="atual">↻</button></div>
        <div class="chips">${resumoChips(a)}</div></div>
      <div class="card" id="licBox"><h2>⏱️ Aluguer do BOT</h2><div id="lic"><div class="vazio">A carregar…</div></div></div>
      <div class="card"><div class="linha" style="align-items:center"><h2 style="flex:1;margin:0">Contas</h2><button class="btn pri peq" id="nova" style="flex:none">＋ Nova conta</button></div>
        <div id="contas"><div class="vazio">A carregar…</div></div></div>
    </div></div>`);
  el.querySelector("#volta").onclick = () => { vista = { tipo:"home" }; desenhar(); };
  el.querySelector("#edit").onclick = () => abrirEditarApp(a);
  el.querySelector("#atual").onclick = async () => { await api("POST",`/apps/${a.id}/atualizar`); await recarregar(); };
  el.querySelector("#nova").onclick = () => abrirConta(a, null, () => carregarContas(a, el));
  carregarContas(a, el);
  carregarLicenca(a, el);
  return el;
}

// ---------- aluguer do BOT (o bot para na hora exata em que acaba) ----------
const fmtHora = (iso) => new Date(iso).toLocaleString("pt-MZ",{ day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
async function carregarLicenca(a, el){
  const box = el.querySelector("#lic");
  const desenharLic = (L) => {
    const estado = !L.limitada ? `<p style="margin:0 0 10px"><b>Sem limite</b> <span class="mut">— o bot nunca para por aluguer.</span></p>`
      : L.suspenso ? `<p style="margin:0 0 10px;color:var(--mau)"><b>🔒 Bot SUSPENSO</b> <span class="mut">desde ${fmtHora(L.ate)}. Não envia megas nem responde.</span></p>`
      : `<p style="margin:0 0 10px"><b>Termina em ${fmtHora(L.ate)}</b> <span class="mut">(faltam ${L.dias} dia${L.dias===1?"":"s"}). Nessa hora o bot para.</span></p>`;
    box.innerHTML = estado + `<div class="acao" style="margin-top:0">${[7,15,30,90].map(d=>`<button class="btn peq" data-d="${d}">+${d} dias</button>`).join("")}</div>
      <div class="linha" style="margin-top:10px"><input id="licDias" type="number" inputmode="numeric" min="1" placeholder="outros dias"><button class="btn pri" id="licOk" style="flex:none">Dar dias</button></div>
      <div class="acao"><button class="btn mau peq" id="licCortar">🔒 Suspender agora</button><button class="btn peq" id="licInf">∞ Sem limite</button></div>
      <div class="erro" id="licEr"></div>`;
    const correr = async (corpo, msg) => {
      try { const j = await api("POST",`/apps/${a.id}/licenca`, corpo); desenharLic(j.licenca); toast(msg); recarregar(false); }
      catch(e){ box.querySelector("#licEr").textContent = e.message; }
    };
    box.querySelectorAll("[data-d]").forEach(b => b.onclick = () => correr({ acao:"dias", dias:Number(b.dataset.d) }, `+${b.dataset.d} dias ao bot`));
    box.querySelector("#licOk").onclick = () => { const d = Number(box.querySelector("#licDias").value); correr({ acao:"dias", dias:d }, `+${d} dias ao bot`); };
    box.querySelector("#licCortar").onclick = () => { if (confirm("Suspender o bot de "+a.nome+" AGORA? Ele para de enviar megas e de responder.")) correr({ acao:"cortar" }, "Bot suspenso"); };
    box.querySelector("#licInf").onclick = () => { if (confirm("Tirar o limite de tempo do bot de "+a.nome+"?")) correr({ acao:"ilimitado" }, "Bot sem limite"); };
  };
  try { const j = await api("GET",`/apps/${a.id}/licenca`); desenharLic(j.licenca); }
  catch(e){ box.innerHTML = `<div class="vazio">⚠️ ${esc(e.message)}<br><span style="font-size:12px">Se disser que não existe, este bot ainda tem o acesso.js antigo.</span></div>`; }
}
async function carregarContas(a, el){
  const box = el.querySelector("#contas");
  try {
    const j = await api("GET",`/apps/${a.id}/contas`);
    const lista = j.contas.filter(c => !c.admin);
    box.innerHTML = "";
    if (!lista.length) { box.innerHTML = `<div class="vazio">Sem contas neste app.</div>`; return; }
    lista.forEach(c => {
      const chips = Object.keys(PERFIS).map(k => {
        const p = c.perfis[k];
        if (!p.existe) return `<span class="chip">${PERFIS[k]}: —</span>`;
        return p.ativo ? `<span class="chip ${p.dias<=3?"av":"ok"}">${PERFIS[k]}: ${p.dias} dia${p.dias===1?"":"s"}</span>` : `<span class="chip mau">${PERFIS[k]}: expirou ${dataCurta(p.ate)}</span>`;
      }).join("");
      const d = h(`<div class="conta"><div class="t"><div><b>${esc(c.nome||"Sem nome")}</b> <span class="mut">${esc(c.numero)}</span></div>
        ${c.ativa?"":`<span class="chip mau">bloqueada</span>`}</div><div class="chips">${chips}</div></div>`);
      const b = h(`<button class="btn peq" style="margin-top:8px">Gerir</button>`);
      b.onclick = () => abrirConta(a, c, () => carregarContas(a, el));
      d.appendChild(b); box.appendChild(d);
    });
  } catch(e){ box.innerHTML = `<div class="vazio">⚠️ ${esc(e.message)}</div>`; }
}

function selectPerfil(id){ return `<select id="${id}"><option value="fornecedor">Fornecedor</option><option value="revendedor">Revendedor</option></select>`; }
function abrirConta(a, c, depois){
  const nova = !c;
  const el = h(`<div><h2>${nova?"Nova conta":esc(c.nome||c.numero)} <span class="mut" style="font-weight:400">— ${esc(a.nome)}</span></h2>
    ${nova?`<label>Número (ex.: 848810528)</label><input id="num" inputmode="numeric">
      <label>Nome</label><input id="nome"><label>PIN (4 a 8 números)</label><input id="pin" inputmode="numeric">`:""}
    <label>${nova?"Aluguer inicial (opcional)":"Pagar aluguer"}</label>
    <div class="linha">${selectPerfil("per")}<input id="dias" type="number" inputmode="numeric" min="1" placeholder="dias" value="30"></div>
    <div class="acao" id="rapidos">${[7,15,30,90].map(d=>`<button class="btn peq" data-d="${d}">${d} dias</button>`).join("")}</div>
    <div class="erro" id="er"></div>
    <div class="acao"><button class="btn pri" id="ok">${nova?"Criar conta":"Dar dias"}</button></div>
    ${nova?"":`<hr style="border:0;border-top:1px solid var(--linha);margin:16px 0">
      <div class="acao"><button class="btn" id="rev">Cortar este perfil</button>
      <button class="btn" id="blq">${c.ativa?"Bloquear conta":"Desbloquear conta"}</button>
      <button class="btn mau" id="rem">Apagar conta</button></div>`}
    <div class="acao"><button class="btn" id="x">Fechar</button></div></div>`);
  const f = folha(el);
  el.querySelector("#x").onclick = () => f.remove();
  el.querySelectorAll("#rapidos button").forEach(b => b.onclick = () => el.querySelector("#dias").value = b.dataset.d);
  const correr = async (corpo, msg) => {
    const er = el.querySelector("#er"); er.textContent = "";
    try { await api("POST",`/apps/${a.id}/conta`, corpo); toast(msg); f.remove(); depois && depois(); recarregar(false); }
    catch(e){ er.textContent = e.message; }
  };
  el.querySelector("#ok").onclick = () => {
    const per = el.querySelector("#per").value, dias = Number(el.querySelector("#dias").value);
    if (nova) correr({ acao:"salvar", numero: el.querySelector("#num").value, nome: el.querySelector("#nome").value, pin: el.querySelector("#pin").value, perfil: dias>0?per:undefined, dias: dias>0?dias:undefined }, "Conta criada");
    else correr({ acao:"pagar", numero:c.numero, perfil:per, dias }, `+${dias} dias (${PERFIS[per]})`);
  };
  if (!nova){
    el.querySelector("#rev").onclick = () => correr({ acao:"revogar", numero:c.numero, perfil: el.querySelector("#per").value }, "Perfil cortado");
    el.querySelector("#blq").onclick = () => correr({ acao: c.ativa?"bloquear":"desbloquear", numero:c.numero }, c.ativa?"Conta bloqueada":"Conta desbloqueada");
    el.querySelector("#rem").onclick = () => { if (confirm("Apagar esta conta de "+a.nome+"?")) correr({ acao:"remover", numero:c.numero }, "Conta apagada"); };
  }
}

function abrirEditarApp(a){
  const el = h(`<div><h2>Editar app</h2>
    <label>Nome</label><input id="n" value="${esc(a.nome)}">
    <label>Endereço do bot</label><input id="u" value="${esc(a.url)}" autocapitalize="off">
    <label>Nova chave (deixe vazio para manter ••••${esc(a.chaveFim)})</label><input id="c" autocapitalize="off">
    <div class="erro" id="er"></div>
    <div class="acao"><button class="btn pri" id="ok">Guardar</button><button class="btn mau" id="del">Remover do painel</button><button class="btn" id="x">Fechar</button></div></div>`);
  const f = folha(el);
  el.querySelector("#x").onclick = () => f.remove();
  el.querySelector("#ok").onclick = async () => {
    try { await api("PUT",`/apps/${a.id}`,{ nome: el.querySelector("#n").value, url: el.querySelector("#u").value, chave: el.querySelector("#c").value || undefined }); f.remove(); toast("Guardado"); recarregar(); }
    catch(e){ el.querySelector("#er").textContent = e.message; }
  };
  el.querySelector("#del").onclick = async () => {
    if (!confirm("Remover "+a.nome+" do painel? (o bot não é apagado)")) return;
    await api("DELETE",`/apps/${a.id}`); f.remove(); vista = { tipo:"home" }; toast("Removido"); recarregar();
  };
}

// ---------- ação em massa ----------
function abrirMassa(){
  if (!apps.length) return toast("Adicione um app primeiro");
  const el = h(`<div><h2>⚡ Ação em massa</h2>
    <p class="mut" style="margin:0 0 8px">Faz a mesma coisa para uma pessoa em vários apps de uma vez.</p>
    <label>Apps</label>
    <div class="card" style="padding:4px 12px;margin:0"><label class="pick" style="margin:0;color:var(--tx)"><input type="checkbox" id="todos"><b>Todos os apps</b></label>
      ${apps.map(a=>`<label class="pick" style="margin:0;color:var(--tx)"><input type="checkbox" class="ap" value="${a.id}"><span>${esc(a.nome)} ${a.estado&&a.estado.online===false?'<span class="chip mau">offline</span>':""}</span></label>`).join("")}</div>
    <div id="blocoNum"><label>Número da pessoa</label><input id="num" inputmode="numeric" placeholder="848810528"></div>
    <label>O que fazer</label>
    <select id="acao"><option value="pagar">Dar dias de aluguer</option><option value="salvar">Criar conta (e dar dias)</option><option value="revogar">Cortar um perfil</option><option value="bloquear">Bloquear conta</option><option value="desbloquear">Desbloquear conta</option><option value="remover">Apagar conta</option><option value="bot_dias">⏱️ Aluguer do BOT: dar dias</option><option value="bot_cortar">⏱️ Aluguer do BOT: suspender agora</option><option value="bot_ilimitado">⏱️ Aluguer do BOT: sem limite</option></select>
    <div id="campos"></div>
    <div class="erro" id="er"></div>
    <div class="acao"><button class="btn pri" id="ok">Executar</button><button class="btn" id="x">Fechar</button></div>
    <div id="res" style="margin-top:12px"></div></div>`);
  const f = folha(el);
  el.querySelector("#x").onclick = () => f.remove();
  const todos = el.querySelector("#todos"), aps = [...el.querySelectorAll(".ap")];
  todos.onchange = () => aps.forEach(x => x.checked = todos.checked);
  const campos = el.querySelector("#campos"), acao = el.querySelector("#acao");
  const desenharCampos = () => {
    const a = acao.value;
    let s = "";
    el.querySelector("#blocoNum").style.display = a.startsWith("bot_") ? "none" : "";
    if (a==="bot_dias") s += `<label>Dias de aluguer do bot</label><input id="dias" type="number" inputmode="numeric" min="1" value="30">`;
    if (a==="salvar") s += `<label>Nome</label><input id="nome"><label>PIN (4 a 8 números)</label><input id="pin" inputmode="numeric">`;
    if (["pagar","revogar","salvar"].includes(a)) s += `<label>Perfil</label>${selectPerfil("per")}`;
    if (["pagar","salvar"].includes(a)) s += `<label>Dias${a==="salvar"?" (opcional)":""}</label><input id="dias" type="number" inputmode="numeric" min="1" value="30">`;
    campos.innerHTML = s;
  };
  acao.onchange = desenharCampos; desenharCampos();
  el.querySelector("#ok").onclick = async () => {
    const er = el.querySelector("#er"); er.textContent = "";
    const ids = aps.filter(x => x.checked).map(x => x.value);
    if (!ids.length) { er.textContent = "Escolha pelo menos um app."; return; }
    const g = (id) => { const e = el.querySelector("#"+id); return e ? e.value : undefined; };
    const a = acao.value;
    if (["bloquear","remover"].includes(a) && !confirm(`${a==="remover"?"Apagar":"Bloquear"} esta conta em ${ids.length} app(s)?`)) return;
    if (a === "bot_cortar" && !confirm(`Suspender o bot em ${ids.length} app(s) AGORA?`)) return;
    if (a === "bot_ilimitado" && !confirm(`Tirar o limite de tempo do bot em ${ids.length} app(s)?`)) return;
    const btn = el.querySelector("#ok"); btn.disabled = true;
    try {
      const j = a.startsWith("bot_")
        ? await api("POST","/massa-licenca",{ apps: todos.checked ? "todos" : ids, acao: a.slice(4), dias: g("dias")?Number(g("dias")):undefined })
        : await api("POST","/massa",{ apps: todos.checked ? "todos" : ids, acao:a, numero:g("num"), perfil:g("per"), dias:g("dias")?Number(g("dias")):undefined, pin:g("pin"), nome:g("nome") });
      el.querySelector("#res").innerHTML = `<h2>${j.feitos} feito${j.feitos===1?"":"s"}${j.falhas?` · ${j.falhas} com problema`:""}</h2>` +
        j.resultados.map(r => `<div class="res"><span>${esc(r.nome)}</span><span style="color:var(--${r.ok?"ok":"mau"})">${r.ok?"✓ ":"✗ "}${esc(r.msg)}</span></div>`).join("");
      recarregar(false);
    } catch(e){ er.textContent = e.message; }
    btn.disabled = false;
  };
}

// ---------- ciclo ----------
async function recarregar(redesenhar = true){
  try {
    const [a, r] = await Promise.all([ api("GET","/apps"), api("GET","/resumo") ]);
    apps = a.apps; resumo = r;
    if (redesenhar && !document.querySelector(".fundo")) desenhar();
  } catch(_) {}
}
async function desenhar(){
  $raiz.innerHTML = "";
  $raiz.appendChild(vista.tipo === "app" ? await ecraApp(vista.id) : ecraHome());
}
function iniciar(){
  const ss = window.painelSessao && window.painelSessao();
  if (!ss || !ss.admin) {
    $raiz.innerHTML = '<div class="wrap"><div class="card"><h2>Só o administrador</h2><p class="mut">Esta página é só para o dono do painel.</p><a class="btn" href="/index.html" style="text-decoration:none;display:inline-block">← Painel</a></div></div>';
    return;
  }
  desenhar();
  recarregar();
  timer = setInterval(() => { if (!document.querySelector(".fundo") && vista.tipo === "home") recarregar(); }, 30000);
}
iniciar();
</script>
</body>
</html>
